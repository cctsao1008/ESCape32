name: AM13E FW1 Compile and Strict Link
on:
  push:
    branches: [am13e-port-v2]
    paths:
      - 'CMakeLists.txt'
      - 'src/**'
      - 'mcu/AM13E/**'
      - 'boot/mcu/AM13E/**'
      - 'boot/tests/**'
      - 'boot/tools/**'
      - '.github/workflows/am13e-fw1-compile-link.yml'
  workflow_dispatch:

jobs:
  fw1-build-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout ESCape32
        uses: actions/checkout@v4

      - name: Install ARM GNU toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1

      - name: Pin TI AM13E SDK source
        shell: bash
        run: |
          git clone --quiet --depth 1 https://github.com/TexasInstruments/am13e2x_sdk.git /tmp/am13e-ti-sdk
          git -C /tmp/am13e-ti-sdk fetch --quiet --depth 1 origin b872469ceef18de5e39a1d3acb0821ec158b44c7
          git -C /tmp/am13e-ti-sdk checkout --quiet --detach b872469ceef18de5e39a1d3acb0821ec158b44c7
          test -f /tmp/am13e-ti-sdk/source/driverlib/am13e230x/dl_flash.h
          arm-none-eabi-gcc --version | head -1

      - name: Reject unknown Boot/Image profile
        shell: bash
        run: |
          set -e
          mkdir -p am13e-ci-logs
          cmake -S . -B am13e-ci-image-profile -G "Unix Makefiles" \
            -DAM13E_SDK_ROOT=/tmp/am13e-ti-sdk \
            -DAM13E_IMAGE_PROFILE=REL17_V14 \
            -DAM13E_BOOT_LINKER_SCRIPT="$(pwd)/boot/mcu/AM13E/config.ld" \
            >am13e-ci-logs/image-profile-positive.log 2>&1
          grep -q 'AM13E_IMAGE_PROFILE:STRING=REL17_V14' \
            am13e-ci-image-profile/CMakeCache.txt
          if cmake -S . -B am13e-ci-image-profile-negative -G "Unix Makefiles" \
            -DAM13E_SDK_ROOT=/tmp/am13e-ti-sdk \
            -DAM13E_IMAGE_PROFILE=UNVERIFIED_LAYOUT \
            >am13e-ci-logs/image-profile-negative.log 2>&1; then
            echo "FAIL: unsupported image profile accepted"
            exit 1
          fi
          grep -q 'Unsupported AM13E_IMAGE_PROFILE' \
            am13e-ci-logs/image-profile-negative.log
          echo 'PASS: Rel17 v1.4 image profile accepted, unknown profile rejected'

      - name: Run Flash, BEMF and motor host regressions
        id: host
        shell: bash
        run: |
          mkdir -p am13e-ci-logs
          set -e
          {
            flags="-std=c11 -O2 -Wall -Wextra -Werror -Wpedantic -Imcu/AM13E"
            run_test () {
              name="$1"
              shift
              cc $flags "$@" -o "/tmp/am13e_$name"
              "/tmp/am13e_$name"
              echo "PASS: $name"
            }
            run_test flash_plan mcu/AM13E/cfg_flash_plan.c mcu/AM13E/tests/cfg_flash_plan_host_test.c
            run_test flash_writer mcu/AM13E/cfg_flash_plan.c mcu/AM13E/cfg_flash_writer.c mcu/AM13E/tests/cfg_flash_writer_host_test.c
            run_test wrp_nonmain -Iboot/mcu/AM13E boot/mcu/AM13E/wrp_nonmain.c boot/tests/am13e_wrp_nonmain_test.c
            run_test adc_scaling mcu/AM13E/analog_calibration_plan.c mcu/AM13E/tests/analog_calibration_plan_host_test.c
            run_test ibus_receiver mcu/AM13E/ibus_receiver.c mcu/AM13E/tests/ibus_receiver_host_test.c
            run_test sbus_receiver mcu/AM13E/sbus_receiver.c mcu/AM13E/tests/sbus_receiver_host_test.c
            run_test sbus2_reply mcu/AM13E/sbus2_reply.c mcu/AM13E/tests/sbus2_reply_host_test.c
            run_test crsf_receiver mcu/AM13E/crsf_receiver.c mcu/AM13E/tests/crsf_receiver_host_test.c
            run_test exbus_receiver mcu/AM13E/exbus_receiver.c mcu/AM13E/tests/exbus_receiver_host_test.c
            run_test exbus_autobaud mcu/AM13E/exbus_autobaud.c mcu/AM13E/tests/exbus_autobaud_host_test.c
            run_test exbus_telemetry_reply mcu/AM13E/exbus_telemetry_reply.c mcu/AM13E/tests/exbus_telemetry_reply_host_test.c
            run_test hott_receiver mcu/AM13E/hott_receiver.c mcu/AM13E/tests/hott_receiver_host_test.c
            run_test crsf_command_reply mcu/AM13E/crsf_command_reply.c mcu/AM13E/tests/crsf_command_reply_host_test.c
            run_test crsf_deferred_command mcu/AM13E/crsf_deferred_command.c mcu/AM13E/tests/crsf_deferred_command_host_test.c
            run_test serial_tx_queue mcu/AM13E/serial_tx_queue.c mcu/AM13E/tests/serial_tx_queue_host_test.c
            run_test serial_frames mcu/AM13E/serial_frame_rx.c mcu/AM13E/tests/serial_frame_rx_host_test.c
            run_test serial_command mcu/AM13E/serial_command.c mcu/AM13E/tests/serial_command_host_test.c
            run_test cli_line_rx mcu/AM13E/cli_line_rx.c mcu/AM13E/tests/cli_line_rx_host_test.c
            run_test bemf_clock mcu/AM13E/tests/motor_bemf_clock_host_test.c
            run_test bemf_commutation -DAM13E mcu/AM13E/motor_bemf_event_plan.c mcu/AM13E/motor_phase_plan.c mcu/AM13E/motor_aq_plan.c mcu/AM13E/motor_timer_math.c mcu/AM13E/tests/motor_bemf_commutation_host_test.c
            run_test motor_aq mcu/AM13E/motor_phase_plan.c mcu/AM13E/motor_aq_plan.c mcu/AM13E/tests/motor_aq_plan_host_test.c
            run_test motor_brake mcu/AM13E/motor_phase_plan.c mcu/AM13E/motor_aq_plan.c mcu/AM13E/tests/motor_brake_aq_host_test.c
            run_test motor_lock mcu/AM13E/motor_phase_plan.c mcu/AM13E/motor_aq_plan.c mcu/AM13E/tests/motor_lock_aq_host_test.c
            run_test motor_audio mcu/AM13E/motor_audio_plan.c mcu/AM13E/tests/motor_audio_plan_host_test.c
            run_test motor_ownership mcu/AM13E/motor_ownership_plan.c mcu/AM13E/motor_phase_plan.c mcu/AM13E/motor_aq_plan.c mcu/AM13E/motor_audio_plan.c mcu/AM13E/tests/motor_ownership_integration_host_test.c
            run_test fault_trip_route mcu/AM13E/fault_trip_route_plan.c mcu/AM13E/tests/fault_trip_route_plan_host_test.c
            run_test motor_pad_route mcu/AM13E/motor_output_route_plan.c mcu/AM13E/tests/motor_output_route_plan_host_test.c
            run_test board_configuration -DAM13E mcu/AM13E/tests/board_configuration_host_test.c
            run_test board_configuration_motor -DAM13E -DAM13E_BOARD_DEVELOPMENT_ACTIVE_TEST -DAM13E_MOTOR_BOARD_DEADBAND_CONFIGURED=1 -DAM13E_BOARD_SENSORS_CONFIGURED=1 mcu/AM13E/tests/board_configuration_host_test.c
            cc $flags -DAM13E -DAM13E_BOARD_DEFAULTS_OVERRIDE_TEST \
              -DAM13E_BOARD_PB13_ACTIVE_LEVEL=0 \
              -DAM13E_MOTOR_DB_RED_TICKS=64 \
              -DAM13E_BOARD_ADC_VREF_MV=3000 \
              -DAM13E_BOARD_OC_GPIO_PINCM=49 \
              -DAM13E_BOARD_SERIAL_TX_PINCM=50 \
              -DAM13E_BOARD_CURRENT_SENSE_PINCM=51 \
              mcu/AM13E/tests/board_configuration_host_test.c -o /tmp/am13e_board_configuration_override
            /tmp/am13e_board_configuration_override
            echo "PASS: board_configuration_override"
            run_test bidir_codec mcu/AM13E/bidir_codec.c mcu/AM13E/tests/bidir_codec_host_test.c
            run_test bidir_timing mcu/AM13E/bidir_codec.c mcu/AM13E/bidir_timing.c mcu/AM13E/tests/bidir_timing_host_test.c
            run_test command_bidir_roundtrip mcu/AM13E/command_decode.c mcu/AM13E/bidir_codec.c mcu/AM13E/bidir_timing.c mcu/AM13E/tests/command_bidir_roundtrip_host_test.c
            run_test motor_duty mcu/AM13E/motor_duty_plan.c mcu/AM13E/tests/motor_duty_plan_host_test.c
            run_test motor_frequency mcu/AM13E/motor_frequency_plan.c mcu/AM13E/tests/motor_frequency_plan_host_test.c
            run_test motor_phase mcu/AM13E/motor_phase_plan.c mcu/AM13E/tests/motor_phase_plan_host_test.c
            run_test motor_pwm_shadow mcu/AM13E/motor_pwm_shadow_plan.c mcu/AM13E/motor_frequency_plan.c mcu/AM13E/motor_duty_plan.c mcu/AM13E/motor_shadow_plan.c mcu/AM13E/tests/motor_pwm_shadow_plan_host_test.c
            run_test motor_shadow mcu/AM13E/motor_shadow_plan.c mcu/AM13E/tests/motor_shadow_plan_host_test.c
            run_test motor_timer_math mcu/AM13E/motor_timer_math.c mcu/AM13E/tests/motor_timer_math_host_test.c
            run_test command_decode mcu/AM13E/command_decode.c mcu/AM13E/tests/command_decode_host_test.c
            run_test telem_modes mcu/AM13E/telem_mode_plan.c mcu/AM13E/tests/telem_mode_plan_host_test.c
            run_test telem_frame_rx mcu/AM13E/telem_frame_rx.c mcu/AM13E/tests/telem_frame_rx_host_test.c
            run_test telem_tx_progress mcu/AM13E/telem_tx_progress.c mcu/AM13E/tests/telem_tx_progress_host_test.c
            run_test arming_window -DAM13E mcu/AM13E/arming_window.c mcu/AM13E/tests/test_arming_window_host.c
            run_test sine_carrier mcu/AM13E/motor_sine_table.c mcu/AM13E/tests/test_sine_carrier_host.c
            cc $flags -DAM13E mcu/AM13E/tests/test_bemf_timeout_host.c -o /tmp/am13e_bemf_timeout
            /tmp/am13e_bemf_timeout
            echo "PASS: bemf_timeout"
          } >am13e-ci-logs/host-tests.log 2>&1 || {
            tail -n 90 am13e-ci-logs/host-tests.log
            exit 1
          }
          cat am13e-ci-logs/host-tests.log

      - name: Compile all original Rel17 FW1 objects and attempt strict full link
        id: build
        shell: bash
        run: |
          set +e
          mkdir -p am13e-ci-logs
          cmake -S . -B am13e-ci-build -G "Unix Makefiles" \
            -DAM13E_SDK_ROOT=/tmp/am13e-ti-sdk \
            -DAM13E_ENABLE_FW1_LINK_GATE=ON \
            -DAM13E_ENABLE_APP_SMOKE=ON \
            -DAM13E_BOOT_LINKER_SCRIPT="$(pwd)/boot/mcu/AM13E/config.ld" \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            >am13e-ci-logs/configure.log 2>&1
          config_rc=$?
          if [ "$config_rc" -eq 0 ]; then
            cmake --build am13e-ci-build --target AM13E -j 2 \
              >am13e-ci-logs/compile.log 2>&1
            compile_rc=$?
          else
            compile_rc=99
            echo "SKIPPED (CMake configuration failed)" >am13e-ci-logs/compile.log
          fi
          if [ "$compile_rc" -eq 0 ]; then
            cmake --build am13e-ci-build --target AM13E_FW1.elf -j 2 \
              >am13e-ci-logs/link.log 2>&1
            link_rc=$?
          else
            link_rc=99
            echo "SKIPPED (FW1 object compilation failed)" >am13e-ci-logs/link.log
          fi
          {
            echo "HEAD=$(git rev-parse HEAD)"
            echo "SDK=b872469ceef18de5e39a1d3acb0821ec158b44c7"
            echo "CONFIGURE_RC=$config_rc"
            echo "OBJECT_COMPILE_RC=$compile_rc"
            echo "STRICT_LINK_RC=$link_rc"
            echo "NOTE=Diagnostic historical linker only; never flash."
          } | tee am13e-ci-logs/summary.txt
          echo "configure_rc=$config_rc" >> "$GITHUB_OUTPUT"
          echo "compile_rc=$compile_rc" >> "$GITHUB_OUTPUT"
          echo "link_rc=$link_rc" >> "$GITHUB_OUTPUT"

      - name: Build board-independent AM13E portable logic
        shell: bash
        run: |
          set -e
          cmake --build am13e-ci-build --target AM13E_PORTABLE_LOGIC -j 2 \
            >am13e-ci-logs/portable-logic-build.log 2>&1
          cat am13e-ci-logs/portable-logic-build.log
          cmake --build am13e-ci-build --target AM13E_MCU_FAULT_TRIP_BACKEND -j 2 \
            >am13e-ci-logs/mcu-fault-trip-backend-build.log 2>&1
          cat am13e-ci-logs/mcu-fault-trip-backend-build.log
          cmake --build am13e-ci-build --target AM13E_MCU_RUNTIME_TICK -j 2 \
            >am13e-ci-logs/mcu-runtime-tick-build.log 2>&1
          cat am13e-ci-logs/mcu-runtime-tick-build.log
          cmake --build am13e-ci-build --target AM13E_MCU_ADC_PAIR_BACKEND -j 2 \
            >am13e-ci-logs/mcu-adc-pair-backend-build.log 2>&1
          cat am13e-ci-logs/mcu-adc-pair-backend-build.log
          cmake --build am13e-ci-build --target AM13E_MCU_COMMAND_INPUT_ROUTE -j 2 \
            >am13e-ci-logs/mcu-command-input-route-build.log 2>&1
          cat am13e-ci-logs/mcu-command-input-route-build.log
          cmake --build am13e-ci-build --target AM13E_MCU_MOTOR_PAD_BACKEND -j 2 \
            >am13e-ci-logs/mcu-motor-pad-backend-build.log 2>&1
          cat am13e-ci-logs/mcu-motor-pad-backend-build.log
          # Catch Reference clock-provider/diagnostic linker regressions too.
          cmake --build am13e-ci-build --target AM13E_CLOCK.elf -j 2 \
            >am13e-ci-logs/reference-clock-diag-build.log 2>&1
          cat am13e-ci-logs/reference-clock-diag-build.log

      - name: Verify Rel17-v1.4 vector-first ARM linker, packer and Boot Flash host transaction
        id: boot
        continue-on-error: true
        shell: bash
        run: |
          set -e
          set -o pipefail
          cmake --build am13e-ci-build --target AM13E_APP_SMOKE -j 2 \
            >am13e-ci-logs/boot-link-pack.log 2>&1 || { cat am13e-ci-logs/boot-link-pack.log; exit 1; }
          cmake -S boot/tests/am13e_host -B am13e-ci-boot-host -G "Unix Makefiles" \
            -DAM13E_HOST_SANITIZERS=OFF \
            -DAM13E_HOST_PACKED_IMAGE="$(pwd)/am13e-ci-build/AM13E_APP_SMOKE.flat-smoke.bin" \
            >am13e-ci-logs/boot-host-configure.log 2>&1
          cmake --build am13e-ci-boot-host -j 2 >am13e-ci-logs/boot-host-build.log 2>&1 || { cat am13e-ci-logs/boot-host-build.log; exit 1; }
          ctest --test-dir am13e-ci-boot-host --output-on-failure \
            2>&1 | tee am13e-ci-logs/boot-host-test.log

      - name: Link and pack FULL FW1 Rel17-v1.4, verify Boot Flash transaction in host memory
        id: rel17
        continue-on-error: true
        shell: bash
        run: |
          set -e
          set -o pipefail
          cmake --build am13e-ci-build --target AM13E_FW1_REL17_IMAGE -j 2 \
            >am13e-ci-logs/fw1-rel17-build.log 2>&1 || { cat am13e-ci-logs/fw1-rel17-build.log; exit 1; }
          arm-none-eabi-size am13e-ci-build/AM13E_FW1_REL17.elf \
            2>&1 | tee am13e-ci-logs/fw1-rel17-size.log
          arm-none-eabi-objdump -h am13e-ci-build/AM13E_FW1_REL17.elf \
            >am13e-ci-logs/fw1-rel17-sections.log
          cmake -S boot/tests/am13e_host -B am13e-ci-rel17-host -G "Unix Makefiles" \
            -DAM13E_HOST_SANITIZERS=OFF \
            -DAM13E_HOST_PACKED_IMAGE="$(pwd)/am13e-ci-build/AM13E_FW1_REL17.flat.bin" \
            >am13e-ci-logs/rel17-host-configure.log 2>&1
          cmake --build am13e-ci-rel17-host -j 2 \
            >am13e-ci-logs/rel17-host-build.log 2>&1 || { cat am13e-ci-logs/rel17-host-build.log; exit 1; }
          ctest --test-dir am13e-ci-rel17-host --output-on-failure \
            2>&1 | tee am13e-ci-logs/rel17-host-test.log

      - name: Link complete ESCape32-derived 16KiB Bootloader for AM13E
        id: boot_elf
        shell: bash
        run: |
          set -e
          set -o pipefail
          cmake --build am13e-ci-build --target BOOT5_PB14.elf -j 2 \
            >am13e-ci-logs/boot-elf-link.log 2>&1 || {
              cat am13e-ci-logs/boot-elf-link.log
              exit 1
            }
          arm-none-eabi-size am13e-ci-build/boot/BOOT5_PB14.elf \
            | tee am13e-ci-logs/boot-elf-size.log
          arm-none-eabi-objdump -h am13e-ci-build/boot/BOOT5_PB14.elf \
            >am13e-ci-logs/boot-elf-sections.log

      - name: Audit Rel17-v1.4 linked Boot/FW1 addresses and ELF-to-BIN integrity
        id: static_image
        shell: bash
        run: |
          set -o pipefail
          python3 mcu/AM13E/tools/verify_rel17_image.py --build am13e-ci-build \
            2>&1 | tee am13e-ci-logs/fw1-rel17-static-audit.log

      - name: Compile current Reference board IO configuration and reject pin conflicts
        id: board_profile
        shell: bash
        run: |
          set -o pipefail
          python3 mcu/AM13E/tests/board_profile_compile_smoke.py am13e-ci-build \
            2>&1 | tee am13e-ci-logs/board-profile-compile.log

      - name: Strict ARM link with synthetic board-selected UNICOMM RX
        id: serial_selected
        shell: bash
        run: |
          # Synthetic fixture only: not a qualified pin/UC mapping.
          # Never flash this ELF to a physical ESC board.
          set -e
          cmake -S . -B am13e-ci-serial-selected -G "Unix Makefiles" \
            -DAM13E_SDK_ROOT=/tmp/am13e-ti-sdk \
            -DAM13E_BOOT_LINKER_SCRIPT="$(pwd)/boot/mcu/AM13E/config.ld" \
            -DAM13E_BOARD_BOARD_PROFILE_FILE="$(pwd)/mcu/AM13E/tests/uart_rx_synthetic_profile.cmake" \
            >am13e-ci-logs/serial-selected-configure.log 2>&1 || {
              cat am13e-ci-logs/serial-selected-configure.log
              exit 1
            }
          cmake --build am13e-ci-serial-selected --target AM13E_FW1_REL17.elf -j 2 \
            >am13e-ci-logs/serial-selected-link.log 2>&1 || {
              cat am13e-ci-logs/serial-selected-link.log
              exit 1
            }
          arm-none-eabi-nm am13e-ci-serial-selected/AM13E_FW1_REL17.elf \
            >am13e-ci-logs/serial-selected-symbols.txt
          grep -Eq ' [Tt] UC0_IRQHandler$' am13e-ci-logs/serial-selected-symbols.txt
          grep -Eq ' [Tt] am13e_app_serial_rx_init$' am13e-ci-logs/serial-selected-symbols.txt
          grep -Eq ' [Tt] am13e_app_io_ibus_frame$' am13e-ci-logs/serial-selected-symbols.txt
          grep -Eq ' [Tt] am13e_app_io_sbus_frame$' am13e-ci-logs/serial-selected-symbols.txt
          grep -Eq ' [Tt] am13e_app_serial_exbus_service_pending$' am13e-ci-logs/serial-selected-symbols.txt
          grep -Eq ' [Tt] am13e_exbus_autobaud_bad$' am13e-ci-logs/serial-selected-symbols.txt
          grep -Eq ' [Tt] am13e_app_io_serial_frame$' am13e-ci-logs/serial-selected-symbols.txt
          echo "PASS synthetic selected UNICOMM RX ARM link; NOT FLASHED"
          # Diagnostic UC TX selected firmware, not a valid PCB pin plan.
          cmake -S . -B am13e-ci-crsf-tx -G "Unix Makefiles" \
            -DAM13E_SDK_ROOT=/tmp/am13e-ti-sdk \
            -DAM13E_BOOT_LINKER_SCRIPT="$(pwd)/boot/mcu/AM13E/config.ld" \
            -DAM13E_BOARD_BOARD_PROFILE_FILE="$(pwd)/mcu/AM13E/tests/uart_crsf_tx_synthetic_profile.cmake" \
            >am13e-ci-logs/serial-tx-configure.log 2>&1 || {
              cat am13e-ci-logs/serial-tx-configure.log
              exit 1
            }
          cmake --build am13e-ci-crsf-tx --target AM13E_FW1_REL17.elf -j 2 \
            >am13e-ci-logs/serial-tx-link.log 2>&1 || {
              cat am13e-ci-logs/serial-tx-link.log
              exit 1
            }
          arm-none-eabi-nm am13e-ci-crsf-tx/AM13E_FW1_REL17.elf \
            >am13e-ci-logs/serial-tx-symbols.txt
          grep -Eq ' [Tt] UC0_IRQHandler$' am13e-ci-logs/serial-tx-symbols.txt
          grep -Eq ' [Tt] am13e_app_io_crsf_reply$' am13e-ci-logs/serial-tx-symbols.txt
          grep -Eq ' [Tt] am13e_crsf_reply_envelope$' am13e-ci-logs/serial-tx-symbols.txt
          grep -Eq ' [Tt] am13e_serial_tx_queue_begin$' am13e-ci-logs/serial-tx-symbols.txt
          grep -Eq ' [Tt] am13e_app_serial_cli_enter$' am13e-ci-logs/serial-tx-symbols.txt
          grep -Eq ' [Tt] am13e_app_serial_cli_service_pending$' am13e-ci-logs/serial-tx-symbols.txt
          grep -Eq ' [Tt] am13e_app_io_cli_line$' am13e-ci-logs/serial-tx-symbols.txt
          echo "PASS selected 2-wire CRSF TX strict ARM link (synthetic, NOT FLASHED)"
          # EXBUS original 7-descriptor/38B response in selected UART
          # never qualifies real EXBUS half-duplex physical timing.
          cmake -S . -B am13e-ci-exbus-tx -G "Unix Makefiles" \
            -DAM13E_SDK_ROOT=/tmp/am13e-ti-sdk \
            -DAM13E_BOOT_LINKER_SCRIPT="$(pwd)/boot/mcu/AM13E/config.ld" \
            -DAM13E_BOARD_BOARD_PROFILE_FILE="$(pwd)/mcu/AM13E/tests/uart_exbus_tx_synthetic_profile.cmake" \
            >am13e-ci-logs/exbus-tx-configure.log 2>&1 || {
              cat am13e-ci-logs/exbus-tx-configure.log
              exit 1
            }
          cmake --build am13e-ci-exbus-tx --target AM13E_FW1_REL17.elf -j 2 \
            >am13e-ci-logs/exbus-tx-link.log 2>&1 || {
              tail -n 65 am13e-ci-logs/exbus-tx-link.log
              exit 1
            }
          arm-none-eabi-nm am13e-ci-exbus-tx/AM13E_FW1_REL17.elf \
            >am13e-ci-logs/exbus-tx-symbols.txt
          grep -Eq ' [Tt] am13e_app_io_exbus_telemetry$' \
            am13e-ci-logs/exbus-tx-symbols.txt
          grep -Eq ' [Tt] UC0_IRQHandler$' am13e-ci-logs/exbus-tx-symbols.txt
          echo "PASS synthetic EXBUS reply TX FIFO/EOT ARM link; NOT FLASHED"
          # Source original Rel17 KISS/iBUS/S.Port/CRSF/MSB/HoTT handlers
          # + actual TI UNICOMM IRQ/FIFO/EOT transport; NEVER FLASH.
          cmake -S . -B am13e-ci-telem -G "Unix Makefiles" \
            -DAM13E_SDK_ROOT=/tmp/am13e-ti-sdk \
            -DAM13E_BOOT_LINKER_SCRIPT="$(pwd)/boot/mcu/AM13E/config.ld" \
            -DAM13E_BOARD_BOARD_PROFILE_FILE="$(pwd)/mcu/AM13E/tests/uart_telem_synthetic_profile.cmake" \
            >am13e-ci-logs/telem-configure.log 2>&1 || {
              cat am13e-ci-logs/telem-configure.log
              exit 1
            }
          cmake --build am13e-ci-telem --target AM13E_FW1_REL17.elf -j 2 \
            >am13e-ci-logs/telem-link.log 2>&1 || {
              cat am13e-ci-logs/telem-link.log
              exit 1
            }
          arm-none-eabi-nm am13e-ci-telem/AM13E_FW1_REL17.elf \
            >am13e-ci-logs/telem-symbols.txt
          grep -Eq ' [Tt] UC1_IRQHandler$' am13e-ci-logs/telem-symbols.txt
          grep -Eq ' [Tt] am13e_telem_hw_init$' am13e-ci-logs/telem-symbols.txt
          grep -Eq ' [Tt] am13e_telem_on_rx_frame$' am13e-ci-logs/telem-symbols.txt
          grep -Eq ' [Tt] am13e_telem_hw_tx_start$' am13e-ci-logs/telem-symbols.txt
          echo "PASS synthetic selected Rel17 telemetry full ARM link; NOT FLASHED"
          # Recovery qualification flags must fail CLOSED if incomplete.
          for flags in \
            '-DAM13E_BOOT_RECOVERY_QUALIFIED=1' \
            '-DAM13E_BOOT_RECOVERY_QUALIFIED=1 -DAM13E_BOOT_ROM_BSL_SWD_RECOVERY_TESTED=1' \
            '-DAM13E_BOOT_RECOVERY_QUALIFIED=1 -DAM13E_BOOT_ROM_BSL_SWD_RECOVERY_TESTED=1 -DAM13E_BOOT_NONMAIN_REVERSIBILITY_TESTED=1' \
            '-DAM13E_BOOT_RECOVERY_QUALIFIED=1 -DAM13E_BOOT_ROM_BSL_SWD_RECOVERY_TESTED=0 -DAM13E_BOOT_NONMAIN_REVERSIBILITY_TESTED=1 -DAM13E_BOOT_POWERLOSS_RECOVERY_TESTED=1 -DAM13E_BOOT_WEP_BITMAP_READBACK_TESTED=1' \
            '-DAM13E_BOOT_RECOVERY_QUALIFIED=1 -DAM13E_BOOT_ROM_BSL_SWD_RECOVERY_TESTED=1 -DAM13E_BOOT_NONMAIN_REVERSIBILITY_TESTED=1 -DAM13E_BOOT_POWERLOSS_RECOVERY_TESTED=1 -DAM13E_BOOT_WEP_BITMAP_READBACK_TESTED=0' \
            '-DAM13E_BOOT_RECOVERY_QUALIFIED=1 -DAM13E_BOOT_ROM_BSL_SWD_RECOVERY_TESTED=1 -DAM13E_BOOT_NONMAIN_REVERSIBILITY_TESTED=1 -DAM13E_BOOT_POWERLOSS_RECOVERY_TESTED=1'; do
            if cc -std=c11 -Iboot/mcu/AM13E -fsyntax-only $flags \
              boot/mcu/AM13E/wrp_nonmain_runtime.c \
              >am13e-ci-logs/boot-gate-negative.log 2>&1; then
              echo 'FAIL unsafe recovery flags accepted' >&2
              exit 1
            fi
            grep -q 'Boot NONMAIN WRP requires verified ROM BSL/SWD' \
              am13e-ci-logs/boot-gate-negative.log
          done
          echo 'PASS Boot NONMAIN recovery flag negative compile guards'
          # Positive is a SYNTHETIC compile/link fixture, NEVER FLASH.
          # These flags do NOT constitute physical recovery evidence.
          cmake -S . -B am13e-ci-boot-qualified -G "Unix Makefiles" \
            -DAM13E_SDK_ROOT=/tmp/am13e-ti-sdk \
            -DAM13E_BOOT_LINKER_SCRIPT="$(pwd)/boot/mcu/AM13E/config.ld" \
            -DCMAKE_C_FLAGS="-DAM13E_BOOT_RECOVERY_QUALIFIED=1 -DAM13E_BOOT_ROM_BSL_SWD_RECOVERY_TESTED=1 -DAM13E_BOOT_NONMAIN_REVERSIBILITY_TESTED=1 -DAM13E_BOOT_POWERLOSS_RECOVERY_TESTED=1 -DAM13E_BOOT_WEP_BITMAP_READBACK_TESTED=1" \
            >am13e-ci-logs/boot-qualified-configure.log 2>&1 || {
              cat am13e-ci-logs/boot-qualified-configure.log
              exit 1
            }
          cmake --build am13e-ci-boot-qualified --target BOOT5_PB14.elf -j 2 \
            >am13e-ci-logs/boot-qualified-link.log 2>&1 || {
              tail -n 90 am13e-ci-logs/boot-qualified-link.log
              exit 1
            }
          arm-none-eabi-nm am13e-ci-boot-qualified/boot/BOOT5_PB14.elf \
            >am13e-ci-logs/boot-qualified-symbols.txt
          grep -Eq ' [Tt] setwrp$' am13e-ci-logs/boot-qualified-symbols.txt
          grep -Eq ' [Tt] boot_am13e_update_commit_quarantined$' \
            am13e-ci-logs/boot-qualified-symbols.txt
          echo "PASS recovery-gated original Boot CMD_UPDATE/WRP strict ARM link; SYNTHETIC NEVER FLASH"

      - name: Audit actual Rel17 functional software coverage
        id: coverage
        shell: bash
        run: |
          set -e
          python3 mcu/AM13E/tools/verify_rel17_coverage.py \
            --build am13e-ci-build --logs am13e-ci-logs

      - name: Enforce original Rel17 and supplied v1.4 design authority
        id: v14_docs
        shell: bash
        run: |
          set -e
          python3 mcu/AM13E/tools/verify_v14_docs.py

      - name: Audit v1.4 upstream source and unresolved Boot interfaces
        id: v14_scope
        shell: bash
        run: |
          set -e
          python3 mcu/AM13E/tools/verify_v14_source_scope.py

      - name: Summarize actual undefined symbols
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import collections, json, pathlib, re
          log=pathlib.Path("am13e-ci-logs/link.log")
          content=log.read_text(errors="replace") if log.exists() else ""
          pattern=r"undefined reference to [\x60']([^\x60']+)[\x60']"
          names=re.findall(pattern,content)
          counts=collections.Counter(names)
          audio={n:k for n,k in counts.items() if n.startswith("am13e_app_audio_")}
          other={n:k for n,k in counts.items() if not n.startswith("am13e_app_audio_")}
          report={
            "undefined_unique":len(counts),
            "undefined_references":len(names),
            "audio_unique":len(audio),
            "non_audio_unique":len(other),
            "audio":dict(sorted(audio.items())),
            "non_audio":dict(sorted(other.items()))
          }
          pathlib.Path("am13e-ci-logs/undefined-symbols.json").write_text(
            json.dumps(report,indent=2)+"\n")
          print(json.dumps(report,indent=2))
          PY

      - name: Upload raw logs and linker map
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: am13e-am13e-fw1-build-evidence
          path: |
            am13e-ci-logs/
            am13e-ci-build/AM13E_FW1.map
            am13e-ci-build/boot/BOOT5_PB14.map
            am13e-ci-build/boot/BOOT5_PB14.elf
            am13e-ci-build/AM13E_FW1_REL17.map
            am13e-ci-build/AM13E_FW1_REL17.elf
            am13e-ci-build/AM13E_FW1_REL17.bin
            am13e-ci-build/AM13E_FW1_REL17.flat.bin
            am13e-ci-build/AM13E_FW1_REL17.json
          retention-days: 14
          if-no-files-found: warn

      - name: Report diagnostic gates
        if: always()
        shell: bash
        run: |
          echo "Configure: ${{ steps.build.outputs.configure_rc }}"
          echo "FW1 objects: ${{ steps.build.outputs.compile_rc }}"
          echo "Strict link: ${{ steps.build.outputs.link_rc }}"
          echo "Reference board IO compile (physical not qualified): ${{ steps.board_profile.outcome }}"
          echo "Synthetic UNICOMM RX full ARM link (NOT FLASHED): ${{ steps.serial_selected.outcome }}"
          echo "Rel17 functional coverage evidence: ${{ steps.coverage.outcome }}"
          echo "Rev1.4 scope audit (open blockers tracked): ${{ steps.v14_scope.outcome }}"
          echo "Rev1.4 documentation/legacy-ABI audit: ${{ steps.v14_docs.outcome }}"
          echo "Motor/ADC/Flash/BEMF host regression: ${{ steps.host.outcome }}"
          echo "Rel17-v1.4 Boot/Link/Pack Host Tests: ${{ steps.boot.outcome }}"
          echo "Actual Rel17 FW1 Rel17-v1.4 ELF/Pack/Flash transaction: ${{ steps.rel17.outcome }}"
          echo "Common 16KiB AM13E Boot ELF: ${{ steps.boot_elf.outcome }}"
          echo "Rel17-v1.4 linked-image static audit: ${{ steps.static_image.outcome }}"
          test "${{ steps.host.outcome }}" = success &&
          test "${{ steps.build.outputs.configure_rc }}" = 0 &&
          test "${{ steps.build.outputs.compile_rc }}" = 0 &&
          test "${{ steps.build.outputs.link_rc }}" = 0 &&
          test "${{ steps.board_profile.outcome }}" = success &&
          test "${{ steps.serial_selected.outcome }}" = success &&
          test "${{ steps.coverage.outcome }}" = success &&
          test "${{ steps.v14_scope.outcome }}" = success &&
          test "${{ steps.v14_docs.outcome }}" = success &&
          test "${{ steps.boot.outcome }}" = success &&
          test "${{ steps.rel17.outcome }}" = success &&
          test "${{ steps.boot_elf.outcome }}" = success &&
          test "${{ steps.static_image.outcome }}" = success
