name: Render Archify v1.6
on:
  push:
    branches: [archify-v1.6]
    paths:
      - 'docs/architecture/*.json'
      - '.github/workflows/render-archify-temp.yml'

permissions:
  contents: write

jobs:
  render:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: archify-v1.6
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch Archify
        run: |
          git clone --depth 1 https://github.com/tt-a1i/archify.git /tmp/archify
          cd /tmp/archify/archify
          npm install
      - name: Normalize JSON IR for current Archify schema
        run: |
          jq '
            .meta.quality_profile = "standard" |
            (.components[] |= (del(.sources) | .size = [220,80])) |
            (.connections[] |= del(.label)) |
            (.connections[] | select(.id=="c13") | .route) = "auto" |
            (.connections[] | select(.id=="c13") | .fromSide) = "bottom" |
            (.connections[] | select(.id=="c13") | .toSide) = "left" |
            (.connections[] | select(.id=="c13") | .via) = [[190,430],[875,430],[875,130]]
          ' docs/architecture/e61-v1.6.architecture.json > /tmp/architecture.json
          mv /tmp/architecture.json docs/architecture/e61-v1.6.architecture.json

          jq '
            .meta.quality_profile = "standard" |
            .lanes = [
              {"id":"main","label":"Motor startup / run"},
              {"id":"feedback","label":"BEMF feedback"},
              {"id":"terminal","label":"Stop / terminal"}
            ] |
            (.states[] | select(.id=="neutral") | .lane) = "main" |
            (.states[] | select(.id=="neutral") | .col) = 0 |
            (.states[] | select(.id=="neutral") | .sublabel) = "stopped" |
            (.states[] | select(.id=="throttle") | .lane) = "main" |
            (.states[] | select(.id=="throttle") | .col) = 1 |
            (.states[] | select(.id=="throttle") | .sublabel) = "valid DShot throttle" |
            (.states[] | select(.id=="start6") | .lane) = "main" |
            (.states[] | select(.id=="start6") | .col) = 2 |
            (.states[] | select(.id=="start6") | .sublabel) = "SINE_RANGE=0" |
            (.states[] | select(.id=="ramp") | .lane) = "main" |
            (.states[] | select(.id=="ramp") | .col) = 3 |
            (.states[] | select(.id=="ramp") | .sublabel) = "duty ramp limits" |
            (.states[] | select(.id=="closed") | .lane) = "main" |
            (.states[] | select(.id=="closed") | .col) = 4 |
            (.states[] | select(.id=="closed") | .label) = "Closed Loop" |
            (.states[] | select(.id=="closed") | .sublabel) = "BEMF synchronized" |
            (.states[] | select(.id=="acquire") | .lane) = "feedback" |
            (.states[] | select(.id=="acquire") | .col) = 2 |
            (.states[] | select(.id=="acquire") | .sublabel) = "BEMF zero crossing" |
            (.states[] | select(.id=="timeout") | .lane) = "feedback" |
            (.states[] | select(.id=="timeout") | .col) = 0 |
            (.states[] | select(.id=="timeout") | .sublabel) = "sync reset" |
            (.states[] | select(.id=="stop") | .lane) = "terminal" |
            (.states[] | select(.id=="stop") | .col) = 2 |
            (.states[] | select(.id=="stop") | .label) = "Stop / Protect" |
            (.states[] | select(.id=="stop") | .sublabel) = "coast / brake / stop" |
            (.transitions[] |= del(.label)) |
            (.transitions[] | select(.id=="t5") | .route) = "straight" |
            (.transitions[] | select(.id=="t5") | .fromSide) = "top" |
            (.transitions[] | select(.id=="t5") | .toSide) = "bottom" |
            (.transitions[] | select(.id=="t8") | .route) = "right-channel" |
            (.transitions[] | select(.id=="t8") | .fromSide) = "right" |
            (.transitions[] | select(.id=="t8") | .toSide) = "right" |
            (.transitions[] | select(.id=="t8") | .channelX) = 820
          ' docs/architecture/e61-v1.6.startup-lifecycle.json > /tmp/lifecycle.json
          mv /tmp/lifecycle.json docs/architecture/e61-v1.6.startup-lifecycle.json

          jq '
            .meta.quality_profile = "standard" |
            .messages = [.messages[] | select(.id != "m3" and .id != "m5")] |
            (.messages[] | select(.id=="m8") | .y) = 600
          ' docs/architecture/e61-v1.6.dshot-sequence.json > /tmp/sequence.json
          mv /tmp/sequence.json docs/architecture/e61-v1.6.dshot-sequence.json
      - name: Render architecture
        run: |
          node /tmp/archify/archify/bin/archify.mjs deliver architecture \
            docs/architecture/e61-v1.6.architecture.json \
            docs/architecture/generated/E61_ESCape32_v1.6_System_Map.html \
            --quality standard --json
      - name: Render lifecycle
        run: |
          node /tmp/archify/archify/bin/archify.mjs deliver lifecycle \
            docs/architecture/e61-v1.6.startup-lifecycle.json \
            docs/architecture/generated/E61_ESCape32_v1.6_Startup_Lifecycle.html \
            --quality standard --json
      - name: Render sequence
        run: |
          node /tmp/archify/archify/bin/archify.mjs deliver sequence \
            docs/architecture/e61-v1.6.dshot-sequence.json \
            docs/architecture/generated/E61_ESCape32_v1.6_DShot_Sequence.html \
            --quality standard --json
      - name: Commit normalized JSON and generated HTML, then remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/architecture/*.json docs/architecture/generated/*.html
          git rm .github/workflows/render-archify-temp.yml
          git commit -m 'docs: render E61 v1.6 Archify HTML artifacts'
          git push origin HEAD:archify-v1.6
